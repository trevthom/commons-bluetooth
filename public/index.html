<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Commons-Bluetooth" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Commons-Bluetooth</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b0f14; color: #e8eef2; height: 100%; overscroll-behavior: none; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React and the QR encoder are compiled into app.js, so nothing is fetched from a CDN. -->
  <script src="lucide.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
